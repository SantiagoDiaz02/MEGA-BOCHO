<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA BOCHO</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-container">
    <header>
      <h1>MEGA BOCHO</h1>
    </header>

    <!-- SECCIÓN CONFIGURACIÓN VERSUS -->
    <section id="sec-config-versus" class="card-panel">
      <h2>Configuración de Partida</h2>

      <div class="config-group">
        <h3>Categorías incluidas</h3>
        <div id="check-categorias" class="grid-cards">
          <!-- Dinámico desde app.js -->
        </div>
      </div>

      <div class="config-group">
        <h3>Dificultades incluidas</h3>
        <div id="check-dificultades" class="grid-cards">
          <!-- Dinámico desde app.js -->
        </div>
      </div>

      <div class="config-group row-steppers">
        <div class="stepper-box">
          <label>Jugadores</label>
          <div class="stepper-controls">
            <button onclick="modificarNumero('num-jugadores', -1, 2, 8, true)">-</button>
            <input type="number" id="num-jugadores" value="2" readonly>
            <button onclick="modificarNumero('num-jugadores', 1, 2, 8, true)">+</button>
          </div>
        </div>
      </div>

      <div class="config-group">
        <h3>Nombres de Jugadores</h3>
        <div id="contenedor-jugadores" class="grid-inputs">
          <!-- Dinámico desde app.js -->
        </div>
      </div>

      <button id="btn-iniciar" class="btn-primary" onclick="iniciarModoVersus()">¡INICIAR PARTIDA!</button>
    </section>

    <!-- SECCIÓN DE JUEGO (VERSUS) -->
    <section id="sec-juego" class="card-panel hidden">
      <!-- SCOREBOARD -->
      <div class="scoreboard">
        <div class="score-card">
          <span class="label">TURNO DE</span>
          <span id="txt-jugador" class="value-highlight">Jugador 1</span>
        </div>
        <div class="score-card">
          <span class="label">PUNTOS</span>
          <span id="txt-puntos" class="value">0 pts</span>
        </div>
        <div class="score-card">
          <span class="label">ESTADO</span>
          <span id="txt-progreso" class="value">En juego</span>
        </div>
      </div>

      <!-- CONTENEDOR DE LA RULETA -->
      <div id="contenedor-ruleta" class="ruleta-box">
        <div class="flecha-indicador"></div>
        <canvas id="canvas-ruleta" width="300" height="300"></canvas>
        <button id="btn-girar" class="btn-primary btn-girar" onclick="girarRuleta()">GIRAR RULETA</button>
      </div>

      <!-- TARJETA DE PREGUNTA -->
      <div id="card-pregunta" class="card-pregunta hidden">
        <div class="badges-row">
          <span id="badge-categoria" class="badge bg-purple">Categoría</span>
          <span id="badge-dificultad" class="badge bg-cyan">Dificultad</span>
        </div>

        <h3 id="txt-pregunta" class="pregunta-texto">¿Texto de la pregunta?</h3>

        <div id="grid-opciones" class="grid-opciones">
          <!-- Opciones dinámicas -->
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
