<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA BOCHO - Modo Versus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <header>
      <h1>🧠 MEGA BOCHO 🧠</h1>
      <p class="subtitle">Modo Versus por Categorías</p>
    </header>

    <!-- Configuración de Sala Versus -->
    <section id="sec-config-versus" class="card">
      <h2>Configuración de la Sala</h2>
      
      <div class="form-group">
        <label>Categorías a jugar:</label>
        <div id="check-categorias" class="checkbox-group">
          <!-- Cargadas dinámicamente con JS -->
        </div>
      </div>

      <div class="form-group">
        <label for="num-preguntas-dif">Preguntas por dificultad (por categoría):</label>
        <input type="number" id="num-preguntas-dif" value="2" min="1" max="10">
      </div>

      <div class="form-group">
        <label for="num-jugadores">Cantidad de jugadores:</label>
        <input type="number" id="num-jugadores" value="2" min="1" max="8" onchange="generarCamposJugadores()">
      </div>

      <!-- Sección dinámica para nombres de jugadores -->
      <div class="form-group">
        <label>Nombres de los Participantes:</label>
        <div id="contenedor-jugadores" class="inputs-jugadores">
          <!-- Inputs generados dinámicamente -->
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="iniciarModoVersus()">¡Empezar Batalla!</button>
      </div>
    </section>

    <!-- Tablero Principal de Juego -->
    <section id="sec-juego" class="hidden">
      
      <!-- Marcador global -->
      <div class="scoreboard card">
        <div class="stat"><small>Jugador Actual</small><strong id="txt-jugador">Jugador 1</strong></div>
        <div class="stat"><small>Puntos</small><strong id="txt-puntos">0 pts</strong></div>
        <div class="stat"><small>Estado</small><strong id="txt-progreso">Cargando...</strong></div>
      </div>

      <!-- Ruleta / Seleccionador -->
      <div id="contenedor-ruleta" class="card">
        <div id="ruleta-visual" class="ruleta-box">GIRA LA RULETA</div>
        <button id="btn-girar" class="btn-primary" onclick="girarRuleta()">Girar Ruleta</button>
      </div>

      <!-- Tarjeta de Pregunta Activa -->
      <div id="card-pregunta" class="card hidden">
        <div class="pregunta-header">
          <span id="badge-categoria" class="badge">Categoría</span>
          <span id="badge-dificultad" class="badge badge-pts">Nivel - Pts</span>
        </div>
        <h3 id="txt-pregunta">Texto de la pregunta</h3>
        <div id="grid-opciones" class="opciones-grid"></div>
      </div>

    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
