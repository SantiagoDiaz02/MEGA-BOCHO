<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGA BOCHO - Trivia de Alto Nivel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <header>
      <h1>🧠 MEGA BOCHO 🧠</h1>
      <p class="subtitle">Demuestra quién sabe más</p>
    </header>

    <!-- 1. Menú de Selección de Modo -->
    <section id="sec-menu" class="card">
      <h2>Selecciona el Modo de Juego</h2>
      <div class="menu-grid">
        <button class="btn-mode" onclick="seleccionarModo('millonario')">
          <span>🏆 Modo Escalera</span>
          <small>17 preguntas en ascenso constante (100 a 300 pts)</small>
        </button>
        <button class="btn-mode" onclick="mostrarConfigVersus()">
          <span>⚔️ Modo Versus</span>
          <small>Compite por categorías y configura tu propia sala</small>
        </button>
      </div>
    </section>

    <!-- 2. Configuración para Modo Versus -->
    <section id="sec-config-versus" class="card hidden">
      <h2>Configuración de la Sala Versus</h2>
      
      <div class="form-group">
        <label>Categorías a jugar:</label>
        <div id="check-categorias" class="checkbox-group">
          <!-- Se cargan dinámicamente desde el JS -->
        </div>
      </div>

      <div class="form-group">
        <label for="num-preguntas-dif">Preguntas por dificultad (por categoría):</label>
        <input type="number" id="num-preguntas-dif" value="5" min="1" max="10">
      </div>

      <div class="form-group">
        <label for="num-jugadores">Cantidad de jugadores:</label>
        <input type="number" id="num-jugadores" value="2" min="1" max="8">
      </div>

      <div class="actions">
        <button class="btn-secondary" onclick="volverAlMenu()">Atrás</button>
        <button class="btn-primary" onclick="iniciarModoVersus()">¡Empezar Batalla!</button>
      </div>
    </section>

    <!-- 3. Tablero Principal de Juego (Área activa) -->
    <section id="sec-juego" class="hidden">
      
      <!-- Marcador global -->
      <div class="scoreboard card">
        <div class="stat"><small>Jugador</small><strong id="txt-jugador">Jugador 1</strong></div>
        <div class="stat"><small>Puntos</small><strong id="txt-puntos">0 pts</strong></div>
        <div class="stat"><small>Progreso</small><strong id="txt-progreso">Pregunta 1/17</strong></div>
      </div>

      <!-- Ruleta / Selección de Categoría -->
      <div id="contenedor-ruleta" class="card">
        <div id="ruleta-visual" class="ruleta-box">GIRA LA RULETA</div>
        <button id="btn-girar" class="btn-primary" onclick="girarRuleta()">Girar Ruleta</button>
      </div>

      <!-- Tarjeta de Pregunta Activa -->
      <div id="card-pregunta" class="card hidden">
        <div class="pregunta-header">
          <span id="badge-categoria" class="badge">Categoría</span>
          <span id="badge-dificultad" class="badge badge-pts">Nivel 1 - 100 pts</span>
        </div>
        <h3 id="txt-pregunta">Aquí aparecerá el texto de la pregunta</h3>
        <div id="grid-opciones" class="opciones-grid">
          <!-- Las opciones de respuesta se renderizan con JS -->
        </div>
      </div>

    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
